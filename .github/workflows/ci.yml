name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest leader/ -v --tb=short

      - name: Run tests with coverage
        run: pytest leader/ --cov=leader --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" --quiet
      - name: Ruff lint
        run: ruff check leader/
      - name: Black format check
        run: black --check leader/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for hardcoded secrets
        run: |
          python -c "
          import os, re, sys
          failed = False
          regex = re.compile(r'sk-(ant|proj|or)-')
          exclude = re.compile(r'sk-test|sk-(ant|proj|or)-\.\.\.|sk-ant-YOUR|sk-(ant|proj|or)-test')
          for root, _, files in os.walk('leader'):
              for file in files:
                  if file.endswith('.py'):
                      with open(os.path.join(root, file), encoding='utf-8') as f:
                          for i, line in enumerate(f):
                              if regex.search(line) and not exclude.search(line):
                                  print(f'ERROR: Possible hardcoded API key in {file}:{i+1}')
                                  failed = True
          if not failed:
              print('No hardcoded secrets found.')
          sys.exit(1 if failed else 0)
          "
